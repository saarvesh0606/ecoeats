# Render Blueprint for the EcoEats API.
#
# Deploys the Docker image (see Dockerfile) as a single free web service.
# Postgres (Neon) and Redis (Upstash) are external — their URLs, plus the
# Firebase and Cloudinary secrets, are set in the Render dashboard, never here
# (every secret below is `sync: false`, so Render prompts for it and keeps it
# out of git).
#
# Render's free tier has no pre-deploy hook, so migrations run at container
# start (see scripts/start.sh, the image's CMD). The free service is a single
# instance, so the usual "don't migrate in every replica" caveat doesn't apply.
#
# There is deliberately no dockerCommand here: Render re-parses that field, and
# an inline "sh -c '... && ...'" comes back as a single argv element, which the
# shell then reports as command-not-found (exit 127). Letting the image's own
# CMD run avoids the quoting entirely.
services:
  - type: web
    name: ecoeats-api
    runtime: docker
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- non-secret runtime config (committed) ---
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1" # 512MB free instance — one worker keeps memory in budget
      - key: DB_STATEMENT_CACHE
        value: "false" # Neon's pooler is transaction-mode
      - key: DB_SSL
        value: "true" # managed Postgres requires TLS
      # --- secrets (set in the Render dashboard; never committed) ---
      - key: DATABASE_URL
        sync: false # Neon POOLED connection string (host contains -pooler)
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL — required in production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false # the whole service-account JSON, inline
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # --- optional: web origins allowed to call the API (browser CORS only) ---
      # Defaults to localhost dev origins if unset; set once a web client is
      # deployed. Native iOS builds don't need this (no browser CORS).
      - key: ALLOWED_ORIGINS
        sync: false
      # --- optional: error tracking ---
      # Sentry stays completely dormant until this is set (api/monitoring.py
      # returns early with no DSN), so an unset value is a supported state, not
      # a broken one. Declared here rather than added straight to the dashboard
      # so Render prompts for it and the service documents its own inputs.
      #
      # `sync: false` because a DSN is a write credential in practice: it can't
      # read your data, but anyone holding it can post events into the project
      # and burn the free-tier quota.
      #
      # Traces are deliberately NOT enabled — SENTRY_TRACES_SAMPLE_RATE defaults
      # to 0.0, so this captures errors only. Performance tracing bills against
      # the same free quota and would spend it on a service whose failure modes
      # are all exceptions.
      - key: SENTRY_DSN
        sync: false
