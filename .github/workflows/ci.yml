name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecoeats
          POSTGRES_PASSWORD: ecoeats
          POSTGRES_DB: ecoeats_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecoeats -d ecoeats_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://ecoeats:ecoeats@localhost:5432/ecoeats_test
      TEST_REDIS_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      # A few tests construct a Firebase verifier (which only loads a cert
      # locally, no Google call). Give them a throwaway, structurally-valid one
      # so the real secret is never needed in CI.
      - name: Generate a throwaway Firebase service account
        run: python scripts/ci_fake_firebase.py
      - run: python -m pytest -q

  frontend:
    name: Frontend · jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm install --legacy-peer-deps
      - name: Lint (biome)
        run: npm run lint
      - run: npx jest --ci

  flutter:
    name: Flutter · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version used locally, so a green run here means the
          # same thing it does on the developer's machine.
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        # Infos are not fatal: ~20 style lints came with this code and failing
        # on them would mean the job is red before it has told anyone anything.
        # Warnings and errors still fail — verified by injecting one.
        run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build web
        # Deliberately built without --dart-define-from-file. CI has no
        # Firebase config and should not need one: the app is meant to fall
        # back to its in-memory repositories when the keys are absent, so this
        # step also proves that fallback still compiles.
        run: flutter build web --no-tree-shake-icons
