# Fly.io deployment for the EcoEats API.
# Secrets (DATABASE_URL, REDIS_URL, AUTH_SECRET, FIREBASE_*, CLOUDINARY_*) are
# set with `fly secrets set`, never committed here.

app = "ecoeats-api"
primary_region = "sjc"

[build]

[env]
  APP_ENV = "production"
  PORT = "8000"
  WEB_CONCURRENCY = "2"
  # Behind Fly's shared Postgres/pooler, keep prepared-statement caching off.
  DB_STATEMENT_CACHE = "false"
  # Managed Postgres requires TLS (asyncpg gets it from here, not the URL).
  DB_SSL = "true"
  # release_command below already migrates; don't repeat it in every instance.
  RUN_MIGRATIONS = "false"

# Migrations run once per deploy, before the new version takes traffic — not in
# each worker's startup, which would race across replicas.
[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
