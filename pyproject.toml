[project]
name = "ecoeats-api"
version = "0.1.0"
description = "EcoEats — campus food rescue API"
requires-python = ">=3.11"
authors = [{ name = "Sarvesh Sunil Jagtap" }]
# Points at the file rather than naming a licence, so changing the terms means
# editing LICENSE alone — nothing here has to move with it.
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.5",
    "redis>=5.0",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Alembic writes the revision files under versions/; they are generated, not
# hand-maintained, so hold env.py to the standard but not these.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# A meaningful, low-noise set: pycodestyle errors (E), pyflakes (F, catches
# unused imports and undefined names), import sorting (I), pyupgrade (UP),
# bugbear (B, real bug patterns), and comprehension checks (C4). Deliberately
# no SIM — its "combine nested with-statements" would flatten the test setup
# that is nested on purpose for readability. Formatting is not enforced here;
# the code is hand-formatted and `ruff format` would reflow it wholesale.
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run, so the session-scoped engine and
# function-scoped sessions are never bound to different loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning"]
