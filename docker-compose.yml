services:
  db:
    image: postgres:16-alpine
    container_name: ecoeats-db
    environment:
      POSTGRES_USER: ecoeats
      POSTGRES_PASSWORD: ecoeats
      POSTGRES_DB: ecoeats
    ports:
      - "5432:5432"
    volumes:
      - ecoeats-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoeats -d ecoeats"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecoeats-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecoeats-pgdata:
